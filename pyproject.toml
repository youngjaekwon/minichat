[project]
name = "minichat"
version = "0.1.0"
description = "Python 3.13 기반 채팅 애플리케이션"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1,<6.0",
    "channels>=4.0,<5.0",
    "channels-redis>=4.0,<5.0",
    "psycopg[binary]>=3.1,<4.0",
    "redis>=5.0,<6.0",
    "celery>=5.3,<6.0",
    "django-anymail>=10.0,<11.0",
    "django-structlog>=8.0,<9.0",
    "pillow>=10.0,<11.0",
    "django-environ>=0.12.0",
    "pydantic>=2.12.5",
    "djangorestframework>=3.16.1",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.5,<5.0",
    "pytest-cov>=4.0,<5.0",
    "factory-boy>=3.3,<4.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=3.6,<4.0",
    "django-debug-toolbar>=4.2,<5.0",
    "django-stubs[compatible-mypy]>=5.0,<6.0",
    "pytest-asyncio>=1.3.0",
]
prod = [
    "gunicorn>=21.0,<22.0",
    "whitenoise>=6.6,<7.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".eggs",
    ".git",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "DJ",     # flake8-django
    "S",      # flake8-bandit (security)
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # assert usage (allowed in tests)
    "S106",   # hardcoded password (allowed in tests)
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
django = ["django"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
strict = false
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = false
exclude = ["migrations", ".venv"]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["celery.*", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "config.settings.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
