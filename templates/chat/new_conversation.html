{% extends "base.html" %}

{% block title %}새 대화 - minichat{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-100">
    <!-- 헤더 -->
    <div class="bg-white shadow-sm">
        <div class="max-w-2xl mx-auto px-4 py-3 flex items-center">
            <a href="{% url 'chat:room_list' %}" class="text-gray-600 hover:text-gray-800 mr-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </a>
            <h1 class="font-semibold text-gray-800">새 대화</h1>
        </div>
    </div>

    <div class="max-w-2xl mx-auto px-4 py-6">
        <!-- 검색 폼 -->
        <form method="get" class="mb-6">
            <div class="relative">
                <input
                    type="text"
                    name="q"
                    value="{{ query }}"
                    placeholder="이름 또는 이메일로 검색..."
                    class="w-full px-4 py-3 pl-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    autofocus
                >
                <svg class="w-5 h-5 text-gray-400 absolute left-3 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </form>

        <!-- 검색 결과 -->
        <div class="bg-white rounded-lg shadow">
            {% if query %}
                {% if users %}
                    {% for user in users %}
                    <form method="post" class="block">
                        {% csrf_token %}
                        <input type="hidden" name="user_id" value="{{ user.pk }}">
                        <button type="submit" class="w-full text-left px-4 py-4 border-b border-gray-100 last:border-b-0 hover:bg-gray-50 transition">
                            <div class="flex items-center">
                                <div class="w-10 h-10 bg-gray-300 rounded-full flex items-center justify-center text-gray-600 font-semibold mr-3">
                                    {{ user.name|slice:":1" }}
                                </div>
                                <div>
                                    <h3 class="font-semibold text-gray-800">{{ user.name }}</h3>
                                    <p class="text-sm text-gray-500">{{ user.email }}</p>
                                    {% if user.job_title %}
                                    <p class="text-xs text-gray-400">{{ user.job_title }}</p>
                                    {% endif %}
                                </div>
                            </div>
                        </button>
                    </form>
                    {% endfor %}
                {% else %}
                    <div class="px-4 py-12 text-center text-gray-500">
                        "{{ query }}"에 대한 검색 결과가 없습니다.
                    </div>
                {% endif %}
            {% else %}
                <div class="px-4 py-12 text-center text-gray-500">
                    대화를 시작할 상대를 검색해주세요.
                </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
